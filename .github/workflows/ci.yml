name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # The secret is absent until it's added to the repo, and on pull requests from forks.
      - name: Deploy to production
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Set the Worker's secrets
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push'
        env:
          LULU_CLIENT_KEY: ${{ secrets.LULU_CLIENT_KEY }}
          LULU_CLIENT_SECRET: ${{ secrets.LULU_CLIENT_SECRET }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
        run: |
          for name in LULU_CLIENT_KEY LULU_CLIENT_SECRET STRIPE_WEBHOOK_SECRET POSTMARK_SERVER_TOKEN; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name"
            else
              echo "::notice::$name isn't set on the repo, so the Worker keeps whatever it has."
            fi
          done

      - name: Subscribe to Lulu's shipping updates
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push'
        env:
          LULU_CLIENT_KEY: ${{ secrets.LULU_CLIENT_KEY }}
          LULU_CLIENT_SECRET: ${{ secrets.LULU_CLIENT_SECRET }}
          WEBHOOK: https://build40for40.com/seasoned/api/lulu/webhook
        run: |
          [ -n "$LULU_CLIENT_KEY" ] || { echo "::notice::No Lulu keys on the repo, so no webhook was set up."; exit 0; }
          api=$(sed -nE 's/.*"LULU_API_URL": "([^"]+)".*/\1/p' wrangler.jsonc)
          token=$(curl -fsS -u "$LULU_CLIENT_KEY:$LULU_CLIENT_SECRET" -d grant_type=client_credentials "$api/auth/realms/glasstree/protocol/openid-connect/token" | jq -r .access_token)
          if curl -fsS -H "Authorization: Bearer $token" "$api/webhooks/" | jq -e --arg url "$WEBHOOK" '.results | any(.url == $url)' > /dev/null; then
            echo "Already subscribed."
          else
            curl -fsS -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "{\"topics\":[\"PRINT_JOB_STATUS_CHANGED\"],\"url\":\"$WEBHOOK\"}" "$api/webhooks/" > /dev/null
            echo "Subscribed."
          fi

      # Preview aliases must be a lowercase DNS label short enough to sit before "-seasoned".
      - name: Name the preview
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: echo "PREVIEW_ALIAS=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')" >> "$GITHUB_ENV"

      - name: Upload a preview
        id: preview
        # A preview can't be uploaded until the first merge to main has created the Worker.
        continue-on-error: true
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          command: versions upload --preview-alias ${{ env.PREVIEW_ALIAS }}

      - name: Comment the preview link
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.preview.outputs.command-output }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url=$(echo "$OUTPUT" | sed -nE 's/.*Version Preview Alias URL: (https:[^ ]+).*/\1/p' | head -1)
          [ -n "$url" ] || { echo "::warning::No preview alias URL in the wrangler output."; exit 0; }
          url="${url%/}/seasoned/"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Preview of ${SHA::7}: $url"

      - name: Skip deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deploy skipped because the CLOUDFLARE_API_TOKEN secret isn't set."
